# AmneziaWG туннель tr-vps -> Miami
# Файл: /etc/wireguard/awg1.conf
#
# На Miami пир tr-vps имеет AllowedIPs = 0.0.0.0/0 (важно! см. configs/miami/awg1-trvps.conf)

[Interface]
Address = 10.66.1.2/24
PrivateKey = [REDACTED]

# Параметры AmneziaWG (должны совпадать с Miami)
Jc = 4
Jmin = 40
Jmax = 70
S1 = 43
S2 = 53

[Peer]
# Miami
PublicKey = [REDACTED]
PresharedKey = [REDACTED]
Endpoint = 45.32.164.69:51830
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25

# PostUp фикс: allowed_ips в conf уже 0.0.0.0/0, но awg-quick иногда не применяет
PostUp = /usr/local/bin/awg set %i peer [REDACTED] allowed-ips 0.0.0.0/0
