# AmneziaWG вход на tr-vps (РФ, обход DPI через H1..H4 обфускацию)
# Файл: /etc/wireguard/awg0.conf
#
# ВАЖНО: amneziawg-tools v3.1 молча отбрасывает Jc/Jmin/Jmax/S1/S2/H1..H4
# при awg-quick up — параметры в conf НЕ применяются к интерфейсу.
# PostUp в этом conf решает проблему: повторно применяет параметры через awg set.
#
# Запуск:
#   sudo /usr/local/bin/awg-quick up awg0

[Interface]
Address = 10.66.3.1/24
ListenPort = 51821
PrivateKey = [REDACTED]
Jc = 4
Jmin = 40
Jmax = 70
S1 = 43
S2 = 53
H1 = 1
H2 = 2
H3 = 3
H4 = 4

# iptables: FORWARD + MASQUERADE для клиентов 10.66.3.0/24
PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT; iptables -t nat -A POSTROUTING -s 10.66.3.0/24 ! -d 10.66.3.0/24 -j MASQUERADE

# Повторно применяем обфускацию (фикс бага v3.1: awg-quick отбрасывает Jc..H4)
PostUp = /usr/local/bin/awg set %i jc 4 jmin 40 jmax 70 s1 43 s2 53 h1 1 h2 2 h3 3 h4 4

# Устанавливаем allowed-ips для каждого пира отдельной строкой
# (при нескольких пирах awg set ставит (none) одному из них)
PostUp = /usr/local/bin/awg set %i peer [REDACTED] allowed-ips 0.0.0.0/0
PostUp = /usr/local/bin/awg set %i peer [REDACTED] allowed-ips 0.0.0.0/0

PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT; iptables -t nat -D POSTROUTING -s 10.66.3.0/24 ! -d 10.66.3.0/24 -j MASQUERADE

[Peer]
# Ноут (laptop)
PublicKey = [REDACTED]
PresharedKey = [REDACTED]
AllowedIPs = 0.0.0.0/0

[Peer]
# Телефон (phone, AmneziaWG)
PublicKey = [REDACTED]
PresharedKey = [REDACTED]
AllowedIPs = 0.0.0.0/0
