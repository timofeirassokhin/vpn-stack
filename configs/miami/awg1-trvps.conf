# AmneziaWG туннель Miami -> tr-vps
# Файл: /etc/wireguard/awg1-trvps.conf
#
# ВАЖНО: AllowedIPs пира tr-vps = 0.0.0.0/0
# Если оставить 10.66.1.2/32, 10.66.3.0/24 — awg на ВХОДЕ будет дропать
# пакеты с dst за пределами этих сетей (например, 8.8.8.8).
# Симптом: телефон подключён, handshake живой, но DNS/TCP не идут.

[Interface]
Address = 10.66.1.1/24
ListenPort = 51830
PrivateKey = [REDACTED]
Jc = 4
Jmin = 40
Jmax = 70
S1 = 43
S2 = 53

# PostUp: явная установка allowed_ips (страховка от awg-quick не применяющего конфиг)
PostUp = /usr/local/bin/awg set %i peer [REDACTED] allowed-ips 0.0.0.0/0
PostDown = /usr/local/bin/awg set %i peer [REDACTED] allowed-ips 10.66.1.2/32

[Peer]
# tr-vps
PublicKey = [REDACTED]
PresharedKey = [REDACTED]
AllowedIPs = 0.0.0.0/0
